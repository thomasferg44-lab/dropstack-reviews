# The email channel runs server-side only: RESEND_API_KEY must never be
# VITE_ prefixed, or Vite would inline it into the browser bundle.

[build]
  command = "npm run build"
  publish = "dist"
  

# The public redirect page is its own tiny bundle. This rule must come first:
# Netlify applies the first match, so /r/* never falls through to the dashboard.
[[redirects]]
  from = "/r/*"
  to = "/r.html"
  status = 200

# Everything else is the single-page dashboard.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  